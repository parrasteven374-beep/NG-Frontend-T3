<div class="login-wrapper">

   <video
    #bgVideo
    class="bg-video"
    autoplay
    loop
    muted
    playsinline
    [volume]="0">

    <source src="/videos/register.mp4" type="video/mp4">
</video>

    <div class="bg-overlay"></div>

    <div class="container min-vh-100 d-flex justify-content-center align-items-center position-relative register-container">

        <div class="card login-card shadow-lg border-0">

            <div class="text-center mb-4">
                <img src="img/logo-pin.svg" alt="Toque Final" class="login-logo">
                <h1 class="fw-bold">Crear cuenta</h1>
                <p class="text-secondary">
                    Completa la información para registrarte.
                </p>
            </div>

            <div class="mb-3">
                <label for="nombres" class="form-label">Nombre completo</label>
                <input id="nombres" type="text" placeholder="Tu nombre completo"
                    autocomplete="name" class="form-control">
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label for="nacimiento" class="form-label">Fecha de nacimiento</label>
                    <input id="nacimiento" type="date"
                        autocomplete="bday" class="form-control">
                </div>
                <div class="col-6">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input id="telefono" type="tel" placeholder="300 123 4567"
                        autocomplete="tel" class="form-control">
                </div>
            </div>

            <div class="mb-3">
                <label for="ciudad" class="form-label">Ciudad</label>
                <input id="ciudad" type="text" placeholder="Ciudad"
                    autocomplete="address-level2" class="form-control">
            </div>

            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input id="correo" type="email" placeholder="tu@email.com"
                    autocomplete="email" class="form-control">
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label for="password" class="form-label">Contraseña</label>
                    <input id="password" type="password" placeholder="Mín. 6 caracteres"
                        autocomplete="new-password" class="form-control">
                </div>
                <div class="col-6">
                    <label for="confirmar" class="form-label">Confirmar contraseña</label>
                    <input id="confirmar" type="password" placeholder="Repítela"
                        autocomplete="new-password" class="form-control">
                </div>
            </div>

            <div class="form-check mb-2">
                <input id="terminos" type="checkbox" class="form-check-input">
                <label for="terminos" class="form-check-label small">
                    Acepto el tratamiento de mis datos personales.
                </label>
            </div>

            <div class="form-check mb-3">
                <input id="promos" type="checkbox" class="form-check-input">
                <label for="promos" class="form-check-label small">
                    Quiero recibir ofertas por WhatsApp.
                </label>
            </div>

            <button
                class="btn btn-primary w-100 mb-3"
                (click)="GoHome()">
                Registrarse
            </button>

            <div class="text-center">
                <span class="text-secondary">¿Ya tienes una cuenta? </span>
                <a routerLink="/login" class="text-decoration-none">
                    Inicia sesión
                </a>
            </div>

        </div>

    </div>

</div>
